name: codeforge

x-database-environment: &database-environment
  DB_HOST: ${DB_HOST:?Set DB_HOST in CodeForge/.env}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:?Set DB_NAME in CodeForge/.env}
  DB_USER: ${DB_USER:?Set DB_USER in CodeForge/.env}
  PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in CodeForge/.env}

x-api-environment: &api-environment
  <<: *database-environment
  QUEUE_CONNECTION_STRING_SEND: ${QUEUE_CONNECTION_STRING_SEND:?Set QUEUE_CONNECTION_STRING_SEND in CodeForge/.env}
  QUEUE_NAME: ${QUEUE_NAME:?Set QUEUE_NAME in CodeForge/.env}

x-worker-environment: &worker-environment
  <<: *database-environment
  QUEUE_CONNECTION_STRING_LISTEN: ${QUEUE_CONNECTION_STRING_LISTEN:?Set QUEUE_CONNECTION_STRING_LISTEN in CodeForge/.env}
  QUEUE_CONNECTION_STRING_SEND: ${QUEUE_CONNECTION_STRING_SEND:?Set QUEUE_CONNECTION_STRING_SEND in CodeForge/.env}
  QUEUE_NAME: ${QUEUE_NAME:?Set QUEUE_NAME in CodeForge/.env}


services:
  migrate:
    image: tahacodeforge.azurecr.io/codeforge-api:v3
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["--migrate"]
    environment: *database-environment
    restart: "no"

  api:
    image: tahacodeforge.azurecr.io/codeforge-api:v3
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    image: tahacodeforge.azurecr.io/codeforge-worker:v3
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *worker-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
